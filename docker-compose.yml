name: library-stack

services:
  logs-init:
    image: alpine:3.21
    command: ["sh", "-c", "mkdir -p /app /nginx /positions /loki /prometheus /grafana && chown 1000:1000 /app && chmod 755 /app && chown 101:101 /nginx && chmod 755 /nginx && chown 65534:65534 /positions /prometheus && chmod 755 /positions /prometheus && chown 10001:10001 /loki && chmod 755 /loki && chown 472:472 /grafana && chmod 755 /grafana"]
    volumes:
      - app_logs:/app
      - nginx_logs:/nginx
      - promtail_positions:/positions
      - loki_data:/loki
      - prometheus_data:/prometheus
      - grafana_data:/grafana
    networks: [monitoring]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: library
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?Set LIBRARY_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  app:
    build: .
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: library
      DB_USER: library_app
      DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?Set LIBRARY_DB_PASSWORD in .env}
      LIBRARY_ADMIN_EMAIL: ${LIBRARY_ADMIN_EMAIL:?Set LIBRARY_ADMIN_EMAIL in .env}
      LIBRARY_ADMIN_PASSWORD: ${LIBRARY_ADMIN_PASSWORD:?Set LIBRARY_ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: "true"
      LOG_FILE: /var/log/library/app.log
    volumes:
      - app_logs:/var/log/library
    networks: [app_net, data]
    depends_on:
      logs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "${WEB_TLS_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks: [app_net, monitoring, edge]
    depends_on: [app, logs-init]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.2
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [data, edge]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}@postgres:5432/library?sslmode=disable
    networks: [data, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    networks: [app_net, monitoring]
    depends_on: [nginx]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [app_net, data, monitoring, edge]
    depends_on:
      logs-init:
        condition: service_completed_successfully
      app:
        condition: service_started
      postgres-exporter:
        condition: service_started
      nginx-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [monitoring]
    depends_on:
      logs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - app_logs:/var/log/library:ro
      - nginx_logs:/var/log/nginx:ro
      - promtail_positions:/run/promtail
    networks: [monitoring]
    depends_on: [loki, logs-init, app, nginx]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring, edge]
    depends_on:
      logs-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  loki_data:
  grafana_data:
  app_logs:
  nginx_logs:
  promtail_positions:

networks:
  app_net:
    internal: true
  data:
    internal: true
  monitoring:
    internal: true
  edge:
    driver: bridge
